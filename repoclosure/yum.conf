[main]
metadata_expire = 1
cachedir=/var/cache/yum
debuglevel=1
reposdir=/dev/null
logfile=/var/log/yum.log
retries=20
obsoletes=1
gpgcheck=0
assumeyes=1
syslog_ident=repoclosure
syslog_device=
protected_packages=
installroot=/

[el9-baseos]
name=CentOS Stream 9 - BaseOS
metalink=https://mirrors.centos.org/metalink?repo=centos-baseos-9-stream&arch=x86_64&protocol=https,http
enabled=1

[el9-appstream]
name=CentOS Stream 9 - AppStream
metalink=https://mirrors.centos.org/metalink?repo=centos-appstream-9-stream&arch=x86_64&protocol=https,http
enabled=1

[el9-crb]
name=CentOS Stream 9 - CRB
metalink=https://mirrors.centos.org/metalink?repo=centos-crb-9-stream&arch=x86_64&protocol=https,http
enabled=1

[el9-pulpcore-nightly-staging]
name=pulpcore nightly EL9
baseurl=https://stagingyum.theforeman.org/pulpcore/nightly/el9/x86_64/

[el9-foreman-plugins-nightly]
name=Foreman plugins nightly EL9
baseurl=https://yum.theforeman.org/plugins/nightly/el9/x86_64/
enabled=1

[el10-baseos]
name=CentOS Stream 10 - BaseOS
metalink=https://mirrors.centos.org/metalink?repo=centos-baseos-10-stream&arch=x86_64&protocol=https,http
enabled=1

[el10-appstream]
name=CentOS Stream 10 - AppStream
metalink=https://mirrors.centos.org/metalink?repo=centos-appstream-10-stream&arch=x86_64&protocol=https,http
enabled=1

[el10-crb]
name=CentOS Stream 10 - CRB
metalink=https://mirrors.centos.org/metalink?repo=centos-crb-10-stream&arch=x86_64&protocol=https,http
enabled=1

[el10-pulpcore-3.105-staging]
name=pulpcore nightly EL10
baseurl=https://stagingyum.theforeman.org/pulpcore/3.105/el10/x86_64/

[el10-foreman-plugins-nightly]
name=Foreman plugins nightly EL10 (COPR staging, no el10 tree on yum.theforeman.org yet)
baseurl=https://download.copr.fedorainfracloud.org/results/@theforeman/plugins-5.0-staging/rhel-10-x86_64/
gpgcheck=0
enabled=1

[el9-pulpcore-3.105-staging]
name=pulpcore 3.105 EL9
baseurl=https://stagingyum.theforeman.org/pulpcore/3.105/el9/x86_64/
