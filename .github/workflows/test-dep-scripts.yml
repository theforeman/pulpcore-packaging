name: Test dep scripts

on:
  pull_request:
    paths:
      - automation/update_deps.py
      - automation/dep_diff.py
      - update_packages.sh
      - automation/tests/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install packaging pytest
      - name: Run tests
        run: pytest automation/tests/ -v
