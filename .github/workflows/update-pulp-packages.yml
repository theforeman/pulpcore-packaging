name: Update package after dependabot merge

on:
  push:
    paths:
      - automation/requirements.txt
    branches:
      - 'rpm/develop'

env:
  GIT_AUTHOR_NAME: Foreman Packaging Automation
  GIT_AUTHOR_EMAIL: packaging@theforeman.org
  PACKAGE_TO_UPDATE: package_list.txt

jobs:

  generate_package_list:
    name: "Generate Package List"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Sort Updated Libs
      run: git diff --unified=0 ${{github.event.before}} ${{github.sha}} automation/requirements.txt | grep -Po '(?<=^\+)(?!\+\+).*' > $PACKAGE_TO_UPDATE
    - name: Parse Package List
      id: set-matrix
      run: ./build_matrix.py < $PACKAGE_TO_UPDATE

  bump-rpms:
    name: 'Bump ${{ matrix.package_name }} RPM ${{ matrix.new_version }}'
    needs: generate_package_list
    if: ${{ needs.generate_package_list.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
       include: ${{ fromJson(needs.generate_package_list.outputs.matrix) }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get install -y --no-install-recommends python3-rpm rpm git-annex python3-semver
        sudo curl --create-dirs -o /usr/local/bin/spectool https://codeberg.org/rpm-community/rpmdevtools/raw/commit/739cb055688c455d5dabf74d48068a655d153ad6/spectool.in
        sudo curl --create-dirs -o /usr/local/bin/rpmdev-bumpspec https://codeberg.org/rpm-community/rpmdevtools/raw/commit/30eca1b7a06a2df5bbfa3bfd6a4c89c19c6ebd60/rpmdev-bumpspec
        sudo curl --create-dirs -o /usr/local/bin/rpmdev-vercmp https://codeberg.org/rpm-community/rpmdevtools/raw/commit/79740e6f1881e399b0b4340a8090dd5adc91a4ea/rpmdev-vercmp
        printf '#!/bin/bash\necho "$GIT_AUTHOR_NAME <$GIT_AUTHOR_EMAIL>"' | sudo tee /usr/local/bin/rpmdev-packager
        sudo chmod +x /usr/local/bin/spectool /usr/local/bin/rpmdev-*
        pip install pyp2spec
        git config --global user.name "$GIT_AUTHOR_NAME"
        git config --global user.email "$GIT_AUTHOR_EMAIL"
    - name: Initialize git annex
      run: git annex init
    - name: Update Packages
      run: ./update_packages.sh  ${{ matrix.package_name }} ${{ matrix.new_version }}
    - name: Generate dependency diff
      id: dep_diff
      run: |
        import subprocess, os, sys
        pkg = "${{ matrix.package_name }}"
        version = "${{ matrix.new_version }}"
        result = subprocess.run(
            ["python3", "find_package.py", "--resolve-dir", pkg],
            capture_output=True, text=True
        )
        if result.returncode != 0:
            with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
                gh.write("dep_diff=_Could not resolve package directory._\n")
            sys.exit(0)
        pkg_dir = result.stdout.strip()
        spec_file = f"packages/{pkg_dir}/{pkg_dir}.spec"
        diff = subprocess.run(
            ["python3", "automation/dep_diff.py", spec_file, pkg, version],
            capture_output=True, text=True
        ).stdout
        delimiter = "DEPDIFF_EOF"
        with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
            gh.write(f"dep_diff<<{delimiter}\n{diff}\n{delimiter}\n")
      shell: python
    - name: Open a PR
      uses: peter-evans/create-pull-request@v8
      with:
        commit-message: "Update ${{ matrix.package_name }} to ${{ matrix.new_version }}"
        branch: "bump_rpm/${{ matrix.package_name }}"
        title: "Update ${{ matrix.package_name }} to ${{ matrix.new_version }}"
        body: |
          ## Dependency changes

          ${{ steps.dep_diff.outputs.dep_diff }}
        delete-branch: true
