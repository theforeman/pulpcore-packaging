version: 2
updates:
  # Maintain dependencies for Pulpcore
  - package-ecosystem: "pip"
    open-pull-requests-limit: 10
    directory: "/automation"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[dependabot]"
    # Add labels for dependabot bumps
    groups:
       # Specify a name for the group, which will be used in pull request titles
       # and branch names
       pulp-cli-deps:
          # pulp-cli, pulp-glue, pulp-cli-deb and pulp-glue-deb are versioned
          # together: pulp-cli-deb pins an exact pulp-glue-deb version and a
          # strict upper bound on pulp-cli/pulp-glue. Grouping all four ensures
          # dependabot only opens a PR when a compatible set exists for all of
          # them simultaneously, preventing pulp-cli/pulp-glue from jumping past
          # the ceiling that the current pulp-cli-deb/pulp-glue-deb supports.
          applies-to: version-updates
          patterns:
            - "pulp-cli"
            - "pulp-glue"
            - "pulp-cli-deb"
            - "pulp-glue-deb"
    labels:
      - "dependabot"
    ignore:
      - dependency-name: "pulpcore*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pulp-rpm*"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pulp-ostree"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pulp-python"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pulp-deb"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pulp-container"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pulp-ansible"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "pulp-smart-proxy"
        update-types: ["version-update:semver-minor"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[dependabot]"

